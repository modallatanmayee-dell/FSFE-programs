
<!DOCTYPE html>
<html>
<head>
    <title>College Departments</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
        }

        h2 {
            text-align: center;
        }

        .container {
            display: grid;

            /* Three columns */
            grid-template-columns: repeat(3, 1fr);

            gap: 20px;
            padding: 20px;
        }

        .department {
            background-color: lightblue;
            border: 2px solid navy;
            padding: 20px;

            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h2>College Departments</h2>

    <div class="container">

        <div class="department">
            Computer Science
        </div>

        <div class="department">
            Electronics
        </div>

        <div class="department">
            Information Technology
        </div>

        <div class="department">
            Mechanical
        </div>

        <div class="department">
            Civil
        </div>

        <div class="department">
            Electrical
        </div>

    </div>

</body>
</html>
