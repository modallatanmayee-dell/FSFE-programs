
<!DOCTYPE html>
<html>
<head>
    <title>Doctor Information</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        h2 {
            text-align: center;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 20px;
        }

        .doctor {
            width: 200px;
            background-color: white;
            border: 2px solid lightblue;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        .doctor h3 {
            color: navy;
        }
    </style>
</head>

<body>

    <h2>Doctor Information</h2>

    <div class="container">

        <div class="doctor">
            <h3>Dr. Ravi</h3>
            <p>Specialization: Cardiologist</p>
            <p>Experience: 10 Years</p>
            <p>Timing: 9 AM - 1 PM</p>
        </div>

        <div class="doctor">
            <h3>Dr. Priya</h3>
            <p>Specialization: Dermatologist</p>
            <p>Experience: 8 Years</p>
            <p>Timing: 10 AM - 2 PM</p>
        </div>

        <div class="doctor">
            <h3>Dr. Kumar</h3>
            <p>Specialization: Dentist</p>
            <p>Experience: 5 Years</p>
            <p>Timing: 2 PM - 6 PM</p>
        </div>

    </div>

</body>
</html>
